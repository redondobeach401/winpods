name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build WinPods.sln -c Release
      - run: dotnet test tests/WinPods.Core.Tests -c Release --no-build
      - run: dotnet publish src/WinPods.App -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: WinPods-win-x64
          path: publish

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build agent
        working-directory: mac/WinPodsAgent
        run: swift build -c release
      - name: Signing test vector (must match WinPods.Core)
        working-directory: mac/WinPodsAgent
        run: "$(swift build -c release --show-bin-path)/WinPodsAgent selftest"
      - name: Bundle .app
        working-directory: mac/WinPodsAgent
        run: ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WinPodsAgent-macOS
          path: mac/WinPodsAgent/WinPodsAgent.app

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build WinPods.sln -c Release -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Vulnerable NuGet packages
        shell: pwsh
        run: |
          $out = dotnet list WinPods.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'has the following vulnerable packages') { exit 1 }
      - run: dotnet test tests/WinPods.Core.Tests -c Release --no-build
      - run: dotnet publish src/WinPods.App -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: WinPods-win-x64
          path: publish

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build agent
        working-directory: mac/WinPodsAgent
        run: swift build -c release
      - name: Signing test vector (must match WinPods.Core)
        working-directory: mac/WinPodsAgent
        run: "$(swift build -c release --show-bin-path)/WinPodsAgent selftest"
      - name: Bundle .app
        working-directory: mac/WinPodsAgent
        run: ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WinPodsAgent-macOS
          path: mac/WinPodsAgent/WinPodsAgent.app

  driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build WinPodsL2cap (KMDF)
        shell: pwsh
        run: |
          msbuild driver\WinPodsL2cap\WinPodsL2cap.vcxproj /p:Configuration=Release /p:Platform=x64 /v:m /nologo > build.log 2>&1
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern ' error | warning ' | Select-Object -First 30 | ForEach-Object { $_.Line -replace '\[.*\]$','' }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinPodsL2cap-unsigned
          path: driver/WinPodsL2cap/**/x64/Release/**
          if-no-files-found: warn
